services:
  db:
    image: mysql:8.0
    container_name: contact_manager_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: contact_manager
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
